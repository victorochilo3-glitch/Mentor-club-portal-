<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mentor Club Portal</title>

  <style>
    * 
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7fb;
      color: #222;
    }

    header {
      background: #123c69;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin-bottom: 5px;
    }

    .container {
      max-width: 600px;
      margin: 25px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 22px;
      margin-bottom: 20px;
      border-radius: 14px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    h2 {
      margin-bottom: 15px;
      color: #123c69;
    }

    input, select, button {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      background: #123c69;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #0d2e50;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .stat {
      background: #eef5ff;
      padding: 18px;
      border-radius: 10px;
      text-align: center;
    }

    .stat strong {
      display: block;
      font-size: 22px;
      margin-top: 8px;
      color: #123c69;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
    }
  </style>
</head>

<body>

  <header>
    <h1>Mentor Club Portal</h1>
    <p>Member Management & Finance Portal</p>
  </header>

  <div class="container">

    <div class="card">
      <h2>Join Mentor Club</h2>

      <input type="text" id="name" placeholder="Full name">
<input type="tel" id="phone" placeholder="Phone number">
<input type="email" id="email" placeholder="Email address">

<input type="password" id="password" placeholder="Password">
<button id="joinButton" onclick="joinClub()">Join Club</button>
  

  
    </div>


<div class="card">
<h2>Club Overview</h2>


      <div class="stats">
        <div class="stat">
          Members
          <strong id="members">0</strong>
        </div>

        <div class="stat">
          Money In
          <strong id="moneyIn">0</strong>
        </div>

        <div class="stat">
          Money Out
          <strong id="moneyOut">0</strong>
        </div>

        <div class="stat">
          Balance
          <strong id="balance">0</strong>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Member Login</h2>

      <input type="email" id="loginEmail" placeholder="Email address">

      <input type="password" id="loginPassword" placeholder="Password">

      <button onclick="login()">Login</button>
    </div>

  </div>

  <footer>
    Mentor Club Association © 2026
  </footer>

 <script>
const SUPABASE_URL = "https://atmhpipzhtiajyekfcrm.supabase.co";
const SUPABASE_KEY = "sb_publishable_LA1_HPf5OLbojF5IlGPtRw_raiL6w8n";



    



    

  

  async function joinClub() {
  alert("IT WORKS");
  alert("1. JOIN FUNCTION STARTED");

  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();

  if (!name || !phone || !email || !password) {
    alert("2. Please fill all fields");
    return;
  }

  alert("3. Fields are OK. Connecting to database...");

  try {
    const response = await fetch(
      SUPABASE_URL + "/rest/v1/members",
      {
        method: "POST",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY,
          "Content-Type": "application/json",
          "Prefer": "return=minimal"
        },
        body: JSON.stringify({
          name: name,
          phone: phone,
          email: email,
          password: password
        })
      }
    );

    alert("4. Database replied: " + response.status);

    if (!response.ok) {
      const errorText = await response.text();
      alert("DATABASE ERROR:\n" + errorText);
      return;
    }

    alert("5. REGISTRATION SUCCESSFUL!");

    document.getElementById("name").value = "";
    document.getElementById("phone").value = "";
    document.getElementById("email").value = "";
    document.getElementById("password").value = "";

  } catch (error) {
    alert("CONNECTION ERROR:\n" + error.message);
  }
    }


function login() {
  alert("Login system will be connected to the member database soon.");
}
  
  
async function showMembers() {
  const section = document.createElement("div");
  section.innerHTML = `
    <div style="background:white; padding:20px; margin:20px auto; max-width:600px; border-radius:12px;">
      <h2 style="color:#123c69;">Member List</h2>
      <div id="membersList">Loading members...</div>
    </div>
  `;

  document.body.appendChild(section);

  try {
    const response = await fetch(
      SUPABASE_URL + "/rest/v1/members?select=name,created_at&order=created_at.desc",
      {
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: "Bearer " + SUPABASE_KEY
        }
      }
    );

    const members = await response.json();

    document.getElementById("membersList").innerHTML = members.map(member => `
      <div style="padding:12px 0; border-bottom:1px solid #ddd;">
        <strong>${member.name}</strong><br>
        <small>Joined: ${new Date(member.created_at).toLocaleString()}</small>
      </div>
    `).join("");
  } catch (error) {
    document.getElementById("membersList").innerHTML =
      "Could not load members.";
  }
}

showMembers();
  </script>

</body>
  </html>
